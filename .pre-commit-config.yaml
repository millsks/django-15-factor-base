# Every hook is local: the tools come from the pixi `dev` feature (all of them
# conda-forge packages), so pre-commit and `pixi run lint` / `check` can never
# disagree on versions, and no hook environments are downloaded or built.
#
# Each entry is prefixed with `pixi run --` so the hooks work when git invokes
# them outside an activated pixi environment.
exclude: '^(\.agents/|\.claude/|\.bmad-loop/|\.pixi/|_bmad/|src/django_service/contrib/sites/migrations/)'

default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      # ---- file hygiene (pre-commit-hooks, conda-forge) ----
      - id: check-added-large-files
        name: check for added large files
        entry: pixi run -- check-added-large-files
        language: system

      - id: check-merge-conflict
        name: check for merge conflicts
        entry: pixi run -- check-merge-conflict
        language: system
        types: [text]

      - id: check-toml
        name: check toml
        entry: pixi run -- check-toml
        language: system
        types: [toml]

      - id: check-yaml
        name: check yaml
        entry: pixi run -- check-yaml
        language: system
        types: [yaml]

      - id: end-of-file-fixer
        name: fix end of files
        entry: pixi run -- end-of-file-fixer
        language: system
        types: [text]

      - id: trailing-whitespace
        name: trim trailing whitespace
        entry: pixi run -- trailing-whitespace-fixer
        language: system
        types: [text]

      # ---- lint / format / types ----
      - id: ruff
        name: ruff check
        entry: pixi run -- ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: ruff-format
        name: ruff format
        entry: pixi run -- ruff format --force-exclude
        language: system
        types_or: [python, pyi]
        require_serial: true

      - id: mypy
        name: mypy
        entry: pixi run -- mypy src/
        language: system
        types: [python]
        pass_filenames: false

      # ---- commit message ----
      - id: conventional-commit-hook
        name: conventional commit message
        entry: pixi run -- conventional-commit-hook
        language: system
        stages: [commit-msg]
        always_run: true
        pass_filenames: true
