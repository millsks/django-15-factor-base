[build-system]
build-backend = "hatchling.build"
requires = [ "hatchling", "hatch-vcs" ]

[project]
name = "django-15-factor-base"
# Version is derived from git tags by hatch-vcs; see [tool.hatch.version].
dynamic = [ "version" ]
description = "A Django application accelerator template based on 15 factor application principles."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Kevin Samuel Mills", email = "millsks@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
# Runtime and development dependencies are declared in pixi.toml, which sources
# them from conda-forge. pixi.toml is the single source of truth for versions;
# this file carries build metadata and tool configuration only.
dependencies = [ ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# 120, not the ruff default of 88. E501 stays selected, so the limit is enforced
# rather than advisory.
line-length = 120

# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
  # Vendored tooling, not project source.
  ".agents",
  ".bmad-loop",
  ".claude",
  ".pixi",
  "_bmad",
  # Planning artifacts. Prose, not source -- and their fenced python blocks
  # quote upstream code verbatim, so formatting them would misrepresent what
  # the quoted source actually looks like.
  "_bmad-output",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  # Conflicts with the formatter, which owns trailing commas -- ruff warns on
  # every run while this is selected. Arrives via the "COM" group above; COM818
  # and COM819 do not conflict and stay enabled.
  "COM812", # Trailing comma missing
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "config", "django_service", "tests" ]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== hatch ====
[tool.hatch.version]
source = "vcs"
# Used when no git tag is reachable (shallow CI clones, fresh repos).
fallback-version = "0.0.0"

# src/ is the import root; config and django_service are both top-level packages.
[tool.hatch.build.targets.wheel]
packages = [ "src/config", "src/django_service" ]

[tool.hatch.build.targets.sdist]
include = [
  "src",
  "tests",
  "manage.py",
  "mkdocs.yml",
  "docs",
  "README.md",
  "LICENSE",
]

# ==== pytest ====
[tool.pytest.ini_options]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
# "src" makes config/ and django_service/ importable; "." makes tests.factories importable.
pythonpath = [ "src", "." ]
testpaths = [ "tests" ]
python_files = [
  "tests.py",
  "test_*.py",
]
markers = [
  "integration: marks tests as integration tests requiring real I/O, network, or DB",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "src/**" ]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "**/*.egg-info/**",       # setuptools build artifacts, not source
  "src/config/wsgi.py",     # deployment entrypoints: no logic, exercised by the
  "src/config/asgi.py",     # WSGI/ASGI server rather than by the test suite
]
# Measures Django templates alongside Python. Requires
# TEMPLATES[0]["OPTIONS"]["debug"] = True, which config/settings/test.py sets,
# and COVERAGE_CORE=ctrace, set in pixi.toml -- see below.
plugins = [ "django_coverage_plugin" ]

[tool.coverage.django_coverage_plugin]
# Defaults to "html, txt, tex", which makes coverage treat stray .txt files
# (setuptools' SOURCES.txt, for one) as templates. Every template here is HTML.
template_extensions = "html"

# ==== mypy ====
[tool.mypy]
# The only Python this project supports. requires-python above pins ==3.14.*
# and pixi.toml pins python = "3.14.*", so 3.14 is the floor and the ceiling
# both; there is no older runtime for mypy to check compatibility against.
python_version = "3.14"
# Strict is a gate condition, not an advisory (NFR-4, AD-18). `pixi run ci`
# chains `typecheck`, so an unannotated definition fails the build rather than
# warning -- which is the point: a relaxation here would otherwise land as one
# line in a config table that nobody reads as a change in what the gate
# enforces. tests/unit/test_typing_policy.py asserts this stays true.
#
# `strict` subsumes warn_unused_ignores, warn_redundant_casts and
# warn_unused_configs. They stay declared because they are explicit and
# harmless, and because they survive independently if strict ever moves.
strict = true
# Not implied by strict, and deliberately kept: several conda-forge packages in
# the runtime set ship no stubs. Removing it is a separate decision that needs
# every third-party import checked first.
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true
# This is not the silencing AC #2 of Story 1.3 forbids. It predates strict mode
# and was not introduced to make it pass: it covers generated migration files,
# which no rule in this product asks anyone to annotate, and it matches the
# exclusions ruff (`extend-exclude = ["*/migrations/*.py", ...]`) and
# pre-commit (`exclude: ... src/django_service/contrib/sites/migrations/`)
# already apply. Do not extend the module pattern to any hand-written module --
# errors in code a person wrote get fixed at the source.

[tool.django-stubs]
django_settings_module = "config.settings.test"

# git-cliff configuration for changelog generation
[tool.git-cliff.changelog]
# changelog header
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

"""
# template for the changelog body
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{commit.scope}}**: {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
# template for the changelog footer
footer = """
<!-- generated by git-cliff -->
"""
# remove the leading and trailing s
trim = true
# postprocessors
postprocessors = [
  # { pattern = '<REPO>', replace = "https://github.com/millsks/django-15-factor-base" }, # replace repository URL
]

[tool.git-cliff.git]
# parse the commits based on https://www.conventionalcommits.org
conventional_commits = true
# filter out the commits that are not conventional
filter_unconventional = true
# process each line of a commit as an individual commit
split_commits = false
# regex for preprocessing the commit messages
commit_preprocessors = [
  # Replace issue numbers
  #{ pattern = '\\((\\w+\\s)?#([0-9]+)\\)', replace = "([#${2}](https://github.com/millsks/django-15-factor-base/issues/${2}))" },
  # Check spelling of the commit with https://github.com/crate-ci/typos
  # If the spelling is incorrect, it will be automatically fixed.
  #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# regex for parsing and grouping commits
commit_parsers = [
  { message = "^feat", group = "⭐ Features" },
  { message = "^fix", group = "🐛 Bug Fixes" },
  { message = "^doc", group = "📚 Documentation" },
  { message = "^perf", group = "⚡ Performance" },
  { message = "^refactor", group = "🚜 Refactor" },
  { message = "^style", group = "🎨 Styling" },
  { message = "^test", group = "🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(deps.*\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^build", group = "📦 Build" },
  { message = "^chore|^ci", group = "⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "🔒 Security" },
  { message = "^revert", group = "◀️ Revert" },
  { message = "^Merge branch", skip = true },
  { message = "^Release v", skip = true },
]
# protect breaking changes from being skipped due to matching a skipping commit_parser
protect_breaking_commits = false
# filter out the commits that are not matched by commit parsers
filter_commits = false
# regex for matching git tags
tag_pattern = "v[0-9].*"
# regex for skipping tags
# skip_tags = ""
# regex for ignoring tags
# ignore_tags = ""
# sort the tags topologically
topo_order = false
# sort the commits inside sections by oldest/newest order
sort_commits = "oldest"
# limit the number of commits included in the changelog.
# limit_commits = 42
