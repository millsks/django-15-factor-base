[build-system]
build-backend = "setuptools.build_meta"
requires = [ "setuptools>=77" ]

[project]
name = "django-15-factor-base"
version = "0.1.0"
description = "A Django application accelerator template based on 15 factor application principles."
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Kevin Samuel Mills", email = "millsks@gmail.com" },
]
requires-python = "==3.14.*"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
# Runtime and development dependencies are declared in pixi.toml, which sources
# them from conda-forge. pixi.toml is the single source of truth for versions;
# this file carries build metadata and tool configuration only.
dependencies = [ ]

# ==== djLint ====
[tool.djlint]
blank_line_after_tag = "load,extends"
custom_blocks = "element,slot"
close_void_tags = true
format_css = true
format_js = true
ignore = "H006,H030,H031"
include = "H017,H035"
indent = 2
max_line_length = 119
profile = "django"
css.indent_size = 2
js.indent_size = 2

# ==== ruff ====
[tool.ruff]
# Exclude a variety of commonly ignored directories.
extend-exclude = [
  "*/migrations/*.py",
  "staticfiles/*",
  # Vendored tooling, not project source.
  ".agents",
  ".bmad-loop",
  ".claude",
  ".pixi",
  "_bmad",
]

lint.select = [
  "A",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DJ",
  "DTZ",
  "E",
  "EM",
  "ERA",
  "EXE",
  "F",
  "FA",
  "FBT",
  "FLY",
  "G",
  "I",
  "ICN",
  "INP",
  "INT",
  "ISC",
  "N",
  "PD",
  "PERF",
  "PGH",
  "PIE",
  "PL",
  "PT",
  "PTH",
  "PYI",
  "Q",
  "RET",
  "RSE",
  "RUF",
  "S",
  "SIM",
  "SLF",
  "SLOT",
  "T10",
  "T20",
  "TC",
  "TID",
  "TRY",
  "UP",
  "W",
  "YTT",
]
lint.ignore = [
  "RUF012", # Mutable class attributes should be annotated with `typing.ClassVar`
  "S101",   # Use of assert detected https://docs.astral.sh/ruff/rules/assert/
  "SIM102", # sometimes it's better to nest
  # of types for comparison.
  # Deactivated because it can make the code slow:
  # https://github.com/astral-sh/ruff/issues/7871
]
lint.isort.force-single-line = true
lint.isort.known-first-party = [ "config", "django_service", "tests" ]

# ==== pyproject-fmt ====
[tool.pyproject-fmt]
keep_full_version = true

# ==== setuptools ====
# src/ is the import root; both config and django_service are top-level packages.
[tool.setuptools.packages.find]
where = [ "src" ]

# ==== pytest ====
[tool.pytest.ini_options]
addopts = [
  "--ds=config.settings.test",
  "--reuse-db",
  "--import-mode=importlib",
]
minversion = "9.0"
# "src" makes config/ and django_service/ importable; "." makes tests.factories importable.
pythonpath = [ "src", "." ]
testpaths = [ "tests" ]
python_files = [
  "tests.py",
  "test_*.py",
]
markers = [
  "integration: marks tests as integration tests requiring real I/O, network, or DB",
]

# ==== Coverage ====
[tool.coverage.run]
include = [ "src/**" ]
omit = [
  "*/migrations/*",
  "*/tests/*",
  "*.egg-info/*",           # setuptools build artifacts, not source
  "src/config/wsgi.py",     # deployment entrypoints: no logic, exercised by the
  "src/config/asgi.py",     # WSGI/ASGI server rather than by the test suite
  "src/config/websocket.py",
]
# django_coverage_plugin measures Django templates as well as Python. It is
# installed and can be re-enabled by adding it here, but the coverage gate
# below is a Python-code gate, so templates are not counted.
plugins = [ ]

# ==== mypy ====
[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
plugins = [
  "mypy_django_plugin.main",
  "mypy_drf_plugin.main",
]

[[tool.mypy.overrides]]
# Django migrations should not produce any errors:
module = "*.migrations.*"
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

# ==== git-cliff ====
[tool.git-cliff.changelog]
header = "# Changelog\n\n"
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}]({{ commit.id }}))
{% endfor %}
{% endfor %}
"""
trim = true

[tool.git-cliff.git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^ci", group = "Continuous Integration" },
  { message = "^build", group = "Build System" },
  { message = "^chore", skip = true },
]
