name: SonarCloud Analysis

# Runs after the gate, not alongside it. AD-18 puts every gate step inside the
# single `pixi run ci` invocation, so this workflow must not measure the suite
# itself -- it consumes the coverage.xml the gate produced. Cross-workflow
# artifacts are only reachable through `workflow_run`, which is why the trigger
# is shaped this way rather than mirroring ci.yml's push/pull_request triggers.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    # A failed gate has nothing worth scanning, and its coverage.xml would
    # describe a build nobody is going to merge.
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      pull-requests: write
      checks: write
      actions: read # required to download an artifact from another run

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Shallow clones should be disabled for better analysis
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.9.5
        with:
          pixi-version: v0.70.2
          environments: dev
          cache: true

      - name: Install dependencies
        run: pixi install -e dev

      # sonar-project.properties points at coverage.xml via
      # sonar.python.coverage.reportPaths, so the file must land at the
      # repository root under that exact name. No `continue-on-error` here: a
      # missing report means the scan would silently claim zero coverage, which
      # is a worse signal than a failed workflow.
      - name: Download coverage report from the gate
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # ruff-report is not a gate step: `lint` gates on findings and runs inside
      # the gate, while this writes the same findings as JSON for the scanner.
      - name: Run ruff linting with JSON output
        run: pixi run ruff-report

      - name: SonarCloud Scan
        uses: sonarsource/sonarqube-scan-action@v7.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Note: For SonarCloud, do not set SONAR_HOST_URL (it defaults to sonarcloud.io)

      - name: SonarCloud Quality Gate check
        id: sonarcloud-quality-gate-check
        uses: sonarsource/sonarqube-quality-gate-action@v1.2.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # Note: For SonarCloud, do not set SONAR_HOST_URL

      - name: "Show SonarCloud Quality Gate Status"
        run: echo "The Quality Gate status is ${{ steps.sonarcloud-quality-gate-check.outputs.quality-gate-status }}"
