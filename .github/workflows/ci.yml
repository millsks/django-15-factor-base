name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# The gate is one task invoked in one place (AD-18). `pixi run ci` runs
# precommit, build, typecheck, lint and test-cov in that order, and a developer
# running it locally executes the identical sequence -- no step exists only here
# or only there. No other workflow may run a gate step on its own.
#
# Why the split below is a split and not a narrowed gate: GitHub Actions
# `services:` containers run only on Linux runners, so the PostgreSQL service
# the gate needs (Story 1.2, FR-32) cannot be attached to a three-OS matrix.
# The gate therefore runs on ubuntu only, and a separate matrix job keeps the
# three-OS claim by running the suite against the sqlite substitution. The two
# jobs assert different things and neither replaces the other.
#
# Any future six-combination job is Linux-only for a second, independent reason:
# `gunicorn` has no win-64 build, and pixi.toml scopes gunicorn/uvicorn-worker
# to linux-64 and osx-arm64 only.

jobs:
  gate:
    name: Gate
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.5
      with:
        # Project-wide pixi version. Must read lock-file format v7 -- the
        # upstream v0.67.2 pin caps out at v6 and cannot read this lock.
        pixi-version: v0.70.2
        environments: dev
        cache: true

    # Story 1.2 attaches a PostgreSQL `services:` block and DATABASE_URL to this
    # job. Keep it shaped so that is a pure insertion.
    - name: Run the gate
      run: pixi run ci

    # sonarqube.yml consumes this rather than running coverage itself, so the
    # gate stays the only place the suite is measured.
    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-xml
        path: coverage.xml
        if-no-files-found: warn
        retention-days: 7

  compatibility:
    name: Compatibility (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Informational only: pixi pins the interpreter (python = "3.14.*") and
        # setup-python is never invoked, so every leg runs Python 3.14.
        python-version: ['3.14']

    steps:
    - uses: actions/checkout@v6

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.5
      with:
        # Project-wide pixi version. Must read lock-file format v7 -- the
        # upstream v0.67.2 pin caps out at v6 and cannot read this lock.
        pixi-version: v0.70.2
        environments: dev
        cache: true

    # Unit tests only, against the sqlite substitution. This job claims "the
    # reference application runs on all three platforms", not "the gate passed";
    # the gate job above is what makes that second claim.
    - name: Run unit tests
      run: pixi run test
