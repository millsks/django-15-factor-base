name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Informational only: pixi pins the interpreter (python = "3.14.*") and
        # setup-python is never invoked, so every leg runs Python 3.14.
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v6

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.5
      with:
        # Project-wide pixi version. Must read lock-file format v7 -- the
        # upstream v0.67.2 pin caps out at v6 and cannot read this lock.
        pixi-version: v0.70.2
        environments: dev
        cache: true

    - name: Run tests
      run: |
        pixi run test

  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up pixi
      uses: prefix-dev/setup-pixi@v0.9.5
      with:
        pixi-version: v0.70.2
        environments: dev
        cache: true

    - name: Lint with ruff
      run: |
        pixi run lint

    - name: Type check with mypy
      run: |
        pixi run typecheck
