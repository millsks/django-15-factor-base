name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Run unit tests
        run: pixi run test

  full:
    name: Full CI
    runs-on: ubuntu-latest
    # The sqlite fallback in config/settings/base.py covers the test settings,
    # so no database service is needed yet. When Postgres is provisioned, add:
    #   services:
    #     postgres:
    #       image: postgres:18
    #       env:
    #         POSTGRES_PASSWORD: postgres
    #       ports: ["5432:5432"]
    #       options: >-
    #         --health-cmd pg_isready --health-interval 10s
    #         --health-timeout 5s --health-retries 5
    # and set DATABASE_URL for the "Run full CI" step.
    steps:
      - uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Run full CI
        run: pixi run ci
